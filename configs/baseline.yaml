run_name: baseline_full_finetune
dataset:
  hf_cache_path: data/DIOR/hf_cache
  img_size: 512
  max_samples: 4000
model:
  dofa_checkpoint: checkpoints/DOFA_ViT_base_e100.pth
  freeze_backbone: false
  use_lora: false
train:
  batch_size: 2
  num_workers: 4
  epochs: 8
  lr: 0.0001
  weight_decay: 0.0001
  seed: 42
  log_every: 20
  checkpoint_dir: experiments/baseline